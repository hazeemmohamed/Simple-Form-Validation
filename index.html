<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="MainContainer">
    <div class="container">
    <form onsubmit="submitForm(event)">
        <table>
            <tr>
                <td class="name">Name</td>
                <td class="textBox">
                    <input type="text" id="name"  class="inputField" onblur="validateForm()"  placeholder="Enter Your Name" > 
                    <br><span id="nameError" class="error" ></span>
                    </td>
            </tr>
                
                
            <tr>
                <td class="name">Email</td>
                <td><input type="email" id="email"  class="inputField" oninput="validateForm()"  placeholder="Enter Your Email Address" >
                <br><span id="emailError" class="error" ></span>
            </td>
            </tr>
            <tr>
                <td class="name">Password</td>
                <td><input type="password" id="password"  oninput="validateForm()" class="inputField" placeholder="Enter Your password" >
                <br><span id="passError" class="error"></span>
            </td>
            </tr>
            <tr >
                <td colspan="2"><input onclick="registerForm()" disabled  class="btnSubmit" type="submit" id="btn"></td>
            </tr>
        </table>
        
        
    </form>
</div>
</div>
    <script src="script.js"></script>
    
</body>
</html>
